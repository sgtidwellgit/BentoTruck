[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bentotruck"
version = "0.1.0"
description = "An agent engineering framework — every compartment of the bento box is a building block for agentic systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sgtidwell" }]
keywords = ["agents", "agentic", "llm", "orchestration", "tools", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "responses>=0.23", "build", "twine"]

[project.urls]
Homepage = "https://github.com/sgtidwellgit/BentoTruck"

[tool.hatch.build.targets.wheel]
packages = ["src/bentotruck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
